name: Release
run-name: Release ${{ inputs.release_type == 'custom' && inputs.custom_version || inputs.release_type }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release: patch, minor, major, or custom'
        type: choice
        required: false
        default: patch
        options: [patch, minor, major, custom]
      custom_version:
        description: "Version to release (only used when release_type is 'custom', e.g. 1.2.3)"
        type: string
        required: false
        default: ''
      default_branch:
        description: 'Branch to release from and push commits/tags back to'
        type: string
        required: false
        default: 'develop'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      release_sha: ${{ steps.release_commit.outputs.sha }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_PRIVATE_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ inputs.default_branch }}

      - name: Configure Git author
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Determine release version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          currentVersion=$(cd packages/maven && ./mvnw -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          baseVersion="${currentVersion%-SNAPSHOT}"

          case "$RELEASE_TYPE" in
            custom)
              releaseVersion="$CUSTOM_VERSION"
              if [ -z "$releaseVersion" ]; then
                echo "custom_version is required when release_type is 'custom'" >&2
                exit 1
              fi
              ;;
            major|minor|patch)
              IFS='.' read -r major minor patch <<< "$baseVersion"
              case "$RELEASE_TYPE" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) ;;
              esac
              releaseVersion="${major}.${minor}.${patch}"
              ;;
            *)
              echo "Unknown release_type '$RELEASE_TYPE'" >&2
              exit 1
              ;;
          esac

          if git rev-parse -q --verify "refs/tags/v$releaseVersion" >/dev/null; then
            echo "Tag v$releaseVersion already exists" >&2
            exit 1
          fi

          IFS='.' read -r relMajor relMinor relPatch <<< "$releaseVersion"
          nextVersion="${relMajor}.${relMinor}.$((relPatch + 1))-SNAPSHOT"

          echo "Releasing version $releaseVersion (current: $currentVersion, next: $nextVersion)"
          {
            echo "release_version=$releaseVersion"
            echo "next_version=$nextVersion"
          } >> "$GITHUB_OUTPUT"

      - name: Bump version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          (cd packages/maven && ./mvnw -B -ntp -q versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false -DprocessAllModules=true)
          npm version --no-git-tag-version "$RELEASE_VERSION" --prefix packages/npm
          npm version --no-git-tag-version "$RELEASE_VERSION"
          git add -u
          git commit -m "Release $RELEASE_VERSION"

      - name: Update changelog
        id: release_commit
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          pip install git-cliff
          git-cliff --config cliff.toml --tag "v$RELEASE_VERSION" --unreleased --prepend CHANGELOG.md
          git-cliff --config cliff.toml --tag "v$RELEASE_VERSION" --unreleased --strip header > RELEASE_NOTES.md
          git add CHANGELOG.md
          git commit -m "chore: Changelog for Release $RELEASE_VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy Maven package
        env:
          MAVEN_USERNAME: x-access-token
          MAVEN_PASSWORD: ${{ steps.app-token.outputs.token }}
        run: |
          (cd packages/maven && ./mvnw -B -ntp clean deploy -DskipTests)

      - name: Prepare next development iteration
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          (cd packages/maven && ./mvnw -B -ntp -q versions:set -DnewVersion="$NEXT_VERSION" -DgenerateBackupPoms=false -DprocessAllModules=true)
          git add -u
          git commit -m "chore: Prepare next development iteration $NEXT_VERSION"

      - name: Refresh GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token-push
        with:
          client-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_PRIVATE_KEY }}

      - name: Push commits
        env:
          GH_TOKEN: ${{ steps.app-token-push.outputs.token }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${DEFAULT_BRANCH}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token-push.outputs.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          RELEASE_SHA: ${{ steps.release_commit.outputs.sha }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            --draft \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_VERSION" \
            --notes-file RELEASE_NOTES.md

  publish-npm:
    name: Publish npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_PRIVATE_KEY }}

      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish packages/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd packages/npm
          npm ci
          npm publish
